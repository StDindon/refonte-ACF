<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Créations - Au Chaudron Fleuri</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #F9F6F0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .loader {
            text-align: center;
        }
        .loader h1 {
            font-family: 'Allison', cursive;
            font-size: 3rem;
            color: #5C4033;
            margin-bottom: 1rem;
        }
        .loader p {
            color: #8B7355;
            font-size: 1.1rem;
        }
        .spinner {
            border: 3px solid #E8E4D8;
            border-top: 3px solid #6B8E23;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <h1>Au Chaudron Fleuri</h1>
        <div class="spinner"></div>
        <p>Redirection vers notre boutique...</p>
    </div>
    
    <script>
        // Redirection automatique vers la boutique SumUp
        window.location.href = 'https://auchaudronfleuri.sumupstore.com/produits';
    </script>
</body>
</html>
