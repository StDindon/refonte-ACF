<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci - Au Chaudron Fleuri</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/merci.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">
                <i class="ri-checkbox-circle-line"></i>
            </div>
            <h1>Merci !</h1>
            <p>Votre commande a été confirmée</p>
        </div>
        <div class="body">
            <p>Nous avons bien reçu votre commande. Sophie la prépare avec soin et vous tiendra informé(e) de son expédition.</p>
            <p style="font-size: 0.95rem; color: rgba(92,64,51,0.6);">Vous recevrez un email de confirmation sous peu.</p>
            <div style="margin-top: 40px;">
                <a href="/chaudron-fleuri/index.html" class="btn">
                    <i class="ri-home-line"></i>
                    Retour à l'accueil
                </a>
                <a href="/chaudron-fleuri/collection.html" class="btn" style="background: transparent; color: #6B8E23; border: 2px solid #6B8E23;">
                    <i class="ri-shopping-bag-line"></i>
                    Continuer mes achats
                </a>
            </div>
        </div>
    </div>
    <script>
        // Vider le panier après confirmation
        localStorage.removeItem('cart');
        localStorage.removeItem('checkout_id');
    </script>
</body>
</html>
